name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:library
      - run: npm run test:library
      - run: npm test -- --watch=false
      - run: npm audit --omit=dev
      - run: npx prettier --check "src/**/*.{ts,html,scss}"
      - run: npm run build
